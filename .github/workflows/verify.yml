name: Verify

on:
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: 11

            - uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile

            - run: pnpm verify

            # Fail if lint:fix changed tracked files during verification.
            - run: git diff --exit-code
